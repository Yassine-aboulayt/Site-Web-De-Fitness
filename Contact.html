<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contactez Élan Fitness, salle de sport à Casablanca.">
  <title>Contact | Élan Fitness</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="en-tete">
    <div class="conteneur en-tete-contenu">
      <a href="./Accueil.html" class="logo">Élan Fitness</a>

      <nav aria-label="Navigation principale">
        <ul class="menu">
          <li><a href="./Accueil.html">Accueil</a></li>
          <li><a href="./Propos.html">À propos</a></li>
          <li><a href="./Programmes.html">Programmes</a></li>
          <li><a href="./Contact.html" class="lien-actif" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section id="contact" class="section">
      <div class="conteneur">

        <div class="section-titre">
          
        </div>

        <form class="formulaire-contact">
          <div class="champ">
            <label for="nom-complet">Nom complet</label>
            <input
              type="text"
              id="nom-complet"
              name="nom_complet"
              autocomplete="name"
              required
            >
          </div>

          <div class="champ">
            <label for="email">Adresse e-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
            >
          </div>

          <div class="champ">
            <label for="telephone">Numéro de téléphone</label>
            <input
              type="tel"
              id="telephone"
              name="telephone"
              autocomplete="tel"
              required
            >
          </div>

          <div class="champ">
            <label for="message">Message</label>
            <textarea
              id="message"
              name="message"
              rows="6"
              required
            ></textarea>
          </div>
        </form>

      </div>
    </section>
  </main>

  <footer class="pied-de-page">
    <div class="conteneur">

      <div class="pied-haut">
        <div>
          <p class="logo logo-clair">Élan Fitness</p>
          <p class="slogan">Ton énergie, ton rythme.</p>
        </div>

        <nav aria-label="Navigation du pied de page">
          <ul class="menu menu-pied">
            <li><a href="./Accueil.html">Accueil</a></li>
            <li><a href="./Propos.html">À propos</a></li>
            <li><a href="./Programmes.html">Programmes</a></li>
            <li><a href="./Contact.html" class="lien-actif" aria-current="page">Contact</a></li>
          </ul>
        </nav>
      </div>

      <div class="pied-bas">
        <p>Adresse : 12 rue des Palmiers, 20000 Casablanca</p>
        <p>&copy; 2026 Élan Fitness — Projet pédagogique fictif</p>
      </div>

    </div>
  </footer>
</body>
</html>
